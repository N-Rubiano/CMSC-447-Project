name: CI — Build, Lint & Test

on:
  push:
    branches: [main, develop, "feature/**", "sprint/**"]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Vite + React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python/FastAPI)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: punchlist_test
          POSTGRES_USER: punchlist
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx pytest-asyncio
      - name: Wait for PostgreSQL
        run: |
          python -c "
          import socket, time
          for _ in range(30):
              try:
                  s = socket.create_connection(('127.0.0.1', 5432), timeout=1)
                  s.close()
                  print('PostgreSQL port 5432 ready')
                  break
              except Exception:
                  time.sleep(1)
          "
      - name: Run migrations
        env:
          DATABASE_URL: postgresql://punchlist:test_password@127.0.0.1:5432/punchlist_test
        run: python -m migrations.runner || true
      - name: Run tests
        env:
          DATABASE_URL: postgresql://punchlist:test_password@127.0.0.1:5432/punchlist_test
          JWT_SECRET: test-secret-ci
        run: pytest tests/ -v --tb=short

  # ── Docker build check ────────────────────────────────────────────────────
  docker-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: punchlistpro-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: punchlistpro-frontend:ci
