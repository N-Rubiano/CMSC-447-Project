<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />

    <!-- ── Primary SEO ──────────────────────────────────────────── -->
    <title>PunchList Pro — Enterprise Construction Punch List & Field Management</title>
    <meta name="description" content="PunchList Pro: Coordinate superintendents, trade foremen, and architects with sub-inch CAD precision. Punch pins, blueprints, offline-first sync, and automated trade stamp attribution." />
    <meta name="keywords" content="construction punch list, field management, blueprint upload, punch pins, building inspection, project management, sub-contractor coordination" />
    <meta name="author" content="PunchList Pro" />
    <meta name="robots" content="index, follow" />

    <!-- ── Favicon / PWA icons ─────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" sizes="512x512" />
    <link rel="apple-touch-icon" href="/favicon.jpg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- ── Theme ────────────────────────────────────────────────── -->
    <meta name="theme-color" content="#D97706" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18181B" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PunchList Pro" />

    <!-- ── Open Graph (LinkedIn / Facebook) ─────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PunchList Pro" />
    <meta property="og:title" content="PunchList Pro — Enterprise Construction Field Management" />
    <meta property="og:description" content="Every punch, pinned to the exact inch on the sheet. Coordinate all trades with offline-first CAD precision." />
    <meta property="og:image" content="/favicon.jpg" />
    <meta property="og:locale" content="en_US" />

    <!-- ── Twitter Card ──────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PunchList Pro — Enterprise Construction Field Management" />
    <meta name="twitter:description" content="Every punch, pinned to the exact inch on the sheet. Offline-first, trade-stamped, field-ready." />
    <meta name="twitter:image" content="/favicon.jpg" />

    <!-- ── Fonts ─────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font load: media=print trick prevents render-blocking -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
